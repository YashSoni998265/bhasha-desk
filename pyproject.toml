[project]
name = "bhasha-desk"
version = "1.0.0"
description = "Agents translate every release into Indian languages; native-speaking teammates approve in team chat, through Switch."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
bhasha = "bhasha.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bhasha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
